openapi: 3.0.3
info:
  title: e-osvita University Provider API
  version: 1.0.0-draft
  description: >-
    Контракт API, який інформаційна система університету надає платформі e-osvita.
    Специфікація відображає поточний адаптер MAUP і містить рекомендації для стабільної v1.
servers:
  - url: https://university.example/api/e-osvita/v1
security:
  - basicAuth: []
paths:
  /studentinfo:
    post:
      summary: Пошук профілів студента
      operationId: getStudentInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [phone_number]
                  properties: { phone_number: { type: string, example: "380501112233" } }
                - type: object
                  required: [student_id]
                  properties: { student_id: { type: integer, example: 10001 } }
      responses:
        '200':
          description: Знайдені профілі
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Student' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /saldo:
    post:
      summary: Поточний баланс оплати навчання
      operationId: getStudentBalance
      requestBody: { $ref: '#/components/requestBodies/StudentId' }
      responses:
        '200':
          description: Баланс
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [student_id, saldo]
                  properties: { student_id: { type: integer }, saldo: { type: number, format: double } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /schedule:
    post:
      summary: Розклад або екзаменаційна сесія студента
      operationId: getStudentSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_id, semestr]
              properties:
                student_id: { type: integer }
                semestr: { type: integer }
                zes_schedule: { type: integer, enum: [1], description: Ознака запиту екзаменаційного розкладу }
      responses:
        '200':
          description: Масив відповідей; поточний адаптер читає перший елемент
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ScheduleResponse' } }
  /marks:
    post:
      summary: Оцінки студента
      operationId: getStudentMarks
      requestBody: { $ref: '#/components/requestBodies/StudentId' }
      responses:
        '200':
          description: Оцінки за семестрами
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MarksResponse' } }
  /calgraph:
    post:
      summary: Календар навчального процесу
      operationId: getCalendarGraph
      requestBody: { $ref: '#/components/requestBodies/StudentId' }
      responses:
        '200':
          description: Події навчального плану
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CalendarEntry' } }
  /payments:
    post:
      summary: Історія оплати навчання
      operationId: getStudentPayments
      requestBody: { $ref: '#/components/requestBodies/StudentId' }
      responses:
        '200':
          description: Історія платежів
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PaymentResponse' } }
  /discounts:
    post:
      summary: Пільги та знижки студента
      operationId: getStudentDiscounts
      requestBody: { $ref: '#/components/requestBodies/StudentId' }
      responses:
        '200':
          description: Знижки
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DiscountResponse' } }
components:
  securitySchemes:
    basicAuth: { type: http, scheme: basic }
  requestBodies:
    StudentId:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [student_id]
            properties: { student_id: { type: integer, example: 10001 } }
  responses:
    Unauthorized: { description: Невірні або відсутні облікові дані }
    Unavailable: { description: Тимчасова недоступність сервісу }
  schemas:
    Student:
      type: object
      required: [student_id, last_name, first_name, phone_number, institute, group, course, form_learn, speciality, price, education_start, education_end]
      properties:
        student_id: { type: integer }
        last_name: { type: string }
        first_name: { type: string }
        middle_name: { type: string, nullable: true }
        nsb: { type: string, description: Номер/підстава навчання }
        group: { type: string }
        course: { type: integer }
        institute: { type: string }
        level_learn: { type: string }
        form_learn: { type: string }
        speciality: { type: string }
        specialization: { type: string, nullable: true }
        qualification: { type: string, nullable: true }
        price: { type: number, format: double }
        price_pay_period: { type: string }
        price_pay_type: { type: string }
        sex: { type: string, nullable: true }
        ipn: { type: string, nullable: true }
        phone_number: { type: string }
        education_start: { type: string, format: date }
        education_end: { type: string, format: date }
    ScheduleItem:
      type: object
      required: [pair_idx, from_time, to_time, pair_subject, pair_auditorium, subject_id]
      properties:
        pair_idx: { type: integer }
        from_time: { type: string, example: "09:00" }
        to_time: { type: string, example: "10:30" }
        pair_kind: { type: string, nullable: true }
        pair_subject: { type: string }
        pair_auditorium: { type: string }
        pair_prepod: { type: string, nullable: true }
        subject_id: { type: integer }
        auditorium_id: { type: integer, nullable: true }
        prepod_id: { type: integer, nullable: true }
        pair_weeks: { type: string, nullable: true }
        day_of_week: { type: string, nullable: true }
        day_of_week_raw: { type: integer, nullable: true }
        day_date: { type: string, format: date, nullable: true }
    ScheduleResponse:
      type: object
      required: [student_id, semestr, zes_schedule, from_date, to_date, schedule]
      properties:
        student_id: { type: integer }
        semestr: { type: integer }
        zes_schedule: { type: integer }
        from_date: { type: string, format: date }
        to_date: { type: string, format: date }
        schedule: { type: array, items: { $ref: '#/components/schemas/ScheduleItem' } }
    MarksResponse:
      type: object
      required: [student_id, marks]
      properties:
        student_id: { type: integer }
        marks:
          type: array
          items:
            type: object
            required: [semestr, subjects]
            properties:
              semestr: { type: integer }
              subjects: { type: array, items: { type: object, additionalProperties: true } }
    CalendarEntry:
      type: object
      required: [semestr, type_id, type, date_from, date_to]
      properties:
        semestr: { type: integer }
        type_id: { type: integer }
        type: { type: string }
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
    PaymentResponse:
      type: object
      required: [student_id, payments]
      properties:
        student_id: { type: integer }
        payments:
          type: array
          items:
            type: object
            required: [date, operation_name, document_type, payment_value]
            properties:
              date: { type: string, format: date }
              operation_name: { type: string }
              document_type: { type: string }
              payment_value: { type: number, format: double }
    DiscountResponse:
      type: object
      required: [student_id, discounts]
      properties:
        student_id: { type: integer }
        discounts:
          type: array
          items:
            type: object
            required: [begin_date, discaunt_name, resp_name, discaunt_percents]
            properties:
              begin_date: { type: string, format: date }
              discaunt_name: { type: string }
              discaunt_period: { type: string, nullable: true }
              institute_name: { type: string }
              resp_name: { type: string }
              discaunt_percents: { type: integer }
              discaunt_id: { type: integer, nullable: true }
              institute_id: { type: integer, nullable: true }

