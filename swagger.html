<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>e-osvita — Swagger API</title>
  <meta name="description" content="Інтерактивна OpenAPI-документація інтеграції університету з e-osvita">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *::before, *::after { box-sizing: inherit; }
    body { margin:0; background-color:#e9e6dc; background-image:linear-gradient(rgba(40,40,35,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(40,40,35,.035) 1px,transparent 1px); background-size:24px 24px; }
    .topbar-custom { display:flex; align-items:center; gap:18px; padding:14px 24px; background:#20201d; color:#fff; border-bottom:4px solid #bd3b19; font:13px "Courier New",monospace; }
    .topbar-custom strong { font-size:20px; color:#ff6b3d; letter-spacing:-.04em; }
    .topbar-custom a { color:#d4d0c5; text-decoration:none; }
    .topbar-custom a:hover { color:#fff; }
    .notice { margin:18px auto 0; max-width:1460px; padding:14px 18px; border:1px solid #cbc8bb; border-left:5px solid #bd3b19; border-radius:2px; background:#fffdf7; color:#3e3d37; font:14px/1.45 system-ui,sans-serif; box-shadow:3px 3px 0 rgba(50,48,42,.12); }
    .swagger-ui .topbar { display:none; }
    .swagger-ui .information-container { padding-top:22px; }
    .swagger-ui .info .title, .swagger-ui .opblock-tag { letter-spacing:-.025em; }
    .swagger-ui .opblock { border-radius:2px; box-shadow:none; }
    .swagger-ui .btn { border-radius:2px; }
    .swagger-ui select { border-radius:2px; }
    @media (max-width:720px) { .topbar-custom { flex-wrap:wrap; } }
  </style>
</head>
<body>
  <header class="topbar-custom">
    <strong>e-osvita API</strong>
    <a href="index.html">Посібник інтеграції</a>
    <a href="application-overview.html">Опис застосунку</a>
    <a href="developer-handover.html">Передача розробнику</a>
    <a href="openapi-university-provider.yaml" download>Provider OpenAPI</a>
  </header>
  <div class="notice"><strong>Тестовий доступ:</strong> username <code>test</code>, password <code>123</code>. Для безпечних проб оберіть сервер <em>GitHub Pages mock API</em>. Відповіді синтетичні, а mock-запити перехоплюються у браузері й не надсилаються зовнішнім системам.</div>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    const startSwagger = () => SwaggerUIBundle({
      url: './openapi-university-provider.yaml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      displayRequestDuration: true,
      filter: true,
      persistAuthorization: false,
      tryItOutEnabled: false,
      docExpansion: 'list',
      defaultModelsExpandDepth: 1,
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: 'StandaloneLayout'
    });

    window.onload = async () => {
      if (!('serviceWorker' in navigator)) return startSwagger();
      await navigator.serviceWorker.register('./mock-sw.js');
      await navigator.serviceWorker.ready;
      if (!navigator.serviceWorker.controller && !sessionStorage.getItem('mock-sw-reload')) {
        sessionStorage.setItem('mock-sw-reload', '1');
        location.reload();
        return;
      }
      sessionStorage.removeItem('mock-sw-reload');
      startSwagger();
    };
  </script>
</body>
</html>
